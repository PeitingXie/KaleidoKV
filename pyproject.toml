[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "kaleidokv"
version = "0.1.0"
description = "Rearranging evidence for efficient KV cache reuse in offline RAG inference"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy>=1.11",
    "tokenizers",
    "rouge-score",
]

[project.optional-dependencies]
serve = ["sglang[all]==0.5.4"]

[tool.setuptools]
packages = ["kaleidokv"]

[tool.black]
line-length = 100
